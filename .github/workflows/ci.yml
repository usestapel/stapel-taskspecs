name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Import check
        run: python -c "import stapel_taskspecs; print('import OK')"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_taskspecs \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-taskspecs
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release-track:
    # Release gate — library-standard §7.4. Installs the package the way an end
    # user does: dependencies resolved from PyPI strictly by the declared pins —
    # no editable siblings. stapel-taskspecs has zero stapel-* dependencies
    # (jsonschema, PyYAML only), so there is no core/sibling version-skew risk
    # to catch here — this is a straightforward wheel-install/import sanity
    # check.
    # Blocking (library-standard §7.5): no stapel dependency graph to wait on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install as an end user (deps resolved from PyPI by pin)
        run: pip install .
      - name: Import smoke (installed package, from a clean dir)
        run: cd "$RUNNER_TEMP" && python -c "import stapel_taskspecs; print('release-track import OK')"
